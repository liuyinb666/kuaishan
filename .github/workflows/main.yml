name: Run Telegram Bot

on:
  push:                # 推送代码时自动运行
  workflow_dispatch:   # 允许在网页手动点击运行
  schedule:            # 可选：定时重启（但会中断）
    - cron: '0 */6 * * *'   # 每6小时重启一次，保证尽量在线

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TOKEN: ${{ secrets.TOKEN }}   # 从仓库 Secrets 读取
        run: python 天真机器人.py
