name: Run Telegram Bot

on:
  # 手动触发
  workflow_dispatch:
  # 或定时触发（例如每小时运行一次，需注意免费版限制）
  # schedule:
  #   - cron: '0 * * * *'

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: 安装依赖
        run: |
          pip install telebot telethon python-socks pysocks

      - name: 运行机器人
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python bot.py
