name: Run Telegram Bot

on:
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击运行
  push:
    branches:
      - main # 如果你的主分支叫 master，请改成 master

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI telethon pysocks python-socks[asyncio]

      - name: Run bot
        env:
          PYTHONUNBUFFERED: 1  # 🚨 关键！强制日志实时输出，解决日志空白问题
        run: python bot.py
